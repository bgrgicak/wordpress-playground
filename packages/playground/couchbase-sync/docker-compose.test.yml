version: '3.8'

services:
    couchdb:
        image: couchdb:3.3
        ports:
            - '5984:5984'
        environment:
            COUCHDB_USER: admin
            COUCHDB_PASSWORD: password
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:5984/_up']
            interval: 5s
            timeout: 5s
            retries: 10
